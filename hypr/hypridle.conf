general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dpms on
}

listener {
    timeout = 300
    on-timeout = hyprlock
}

listener {
    timeout = 600
    on-timeout = hyprctl dpms off
    on-resume = hyprctl dpms on
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
