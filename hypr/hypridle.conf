general {
    lock_cmd = pidof swaylock || swaylock
    before_sleep_cmd = swaylock
    after_sleep_cmd = hyprctl dpms on
}

listener {
    timeout = 300
    on-timeout = swaylock
}

listener {
    timeout = 600
    on-timeout = hyprctl dpms off
    on-resume = hyprctl dpms on
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
