background {

	monitor =
	path = /home/adriangln/Pictures/wallpapers/wall2.png
	blur_passes = 1
	blur_size = 7
	vibrancy = 0.9
	contrast = 0.8
	brightness = 0.3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

#outer_color = rgba(176, 114, 209, 1)
    outer_color = rgba(0, 0, 0, 0)
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    #check_color=rgba(0,0,0,0.0)
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg
    #fail_color=rgba(0,0,0, 0.0)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER

    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Noto Sans

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<small>$(date)</small>"
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Noto Sans

    position = 0, 80
    halign = center
    valign = center
}
