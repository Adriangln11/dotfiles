"$schema" = 'https://starship.rs/config-schema.json'


format = """
$os$directory$git_branch$git_status$cmd_duration
$character"""

palette = 'catppuccin_mocha'

# ─────────────── PALETTE ───────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
overlay0 = "#6c7086"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ─────────────── MÓDULOS ───────────────

[os]
disabled = false
format = "[$symbol ](fg:blue)"
style = "fg:blue"
[os.symbols]
Arch = "󰣇"

[directory]
style = "fg:text"
format = "[$path]($style) "
truncation_length = 2
truncation_symbol = "./"
[git_branch]
symbol = ""
format = "[$symbol $branch]($style) "
style = "fg:blue"

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "fg:peach"

[cmd_duration]
min_time = 20
format = "[ $duration]($style) "
style = "fg:overlay0"

# Opcionalmente muestra versión del lenguaje activo (solo si estás en un proyecto)
[nodejs]
symbol = ""
format = "[$symbol$version]($style) "
style = "fg:green"

[rust]
symbol = ""
format = "[$symbol$version]($style) "
style = "fg:peach"

[python]
symbol = ""
format = "[$symbol$version]($style) "
style = "fg:yellow"

[docker_context]
symbol = ""
format = "[$symbol $context]($style) "
style = "fg:teal"

[time]
disabled = true  # lo eliminamos para más limpieza

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:blue)"
format = "$symbol "
